# what the scripts in bin need to know about this project. the scripts are the same in every
# kotlin multiplatform project; only this file changes from one to the next

# the gradle module of the android app, and its application id
android.module=androidApp
android.applicationId=com.joshlong.mogul.clip

# the xcode project, relative to this file, and the scheme that builds the ios app
ios.project=iosApp/iosApp.xcodeproj
ios.scheme=iosApp
# what to call the archive the release builds make
ios.archive=clip
# the simulator bin/ios-dev.sh runs on, unless SIMULATOR names another
ios.simulator=iPhone 17

# the gradle property the apps read their server from, and the server the release builds
# point at, unless APP_SERVER names another
server.property=mogul.server
server.production=https://studio.mogul.tools

# how to get the app store connect api key into the environment, for bin/ios-testflight.sh
secrets.hint=source ~/code/mogul/workspace/bin/env.sh
