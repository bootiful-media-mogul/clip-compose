name: Android

# every push to main that touches the app goes to google play's internal testing track
# (bin/android-play.sh), the way it would from a laptop.
#
# secrets:
#   ANDROID_KEYSTORE_BASE64     the upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT        the json key of the service account play console lets release
# and a variable, if play console still has the app as a draft:
#   PLAY_RELEASE_STATUS         draft (completed otherwise)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'iosApp/**'
      - 'webApp/**'
      - 'desktopApp/**'
      - '**.md'
      - '.github/workflows/ios.yaml'
      - '.github/workflows/web.yaml'
      - '.github/workflows/desktop.yaml'
      - '.github/workflows/build-container.sh'
      - '.github/workflows/import-certificate.sh'
      - '.github/workflows/nginx-buildpack-config/**'
  workflow_dispatch:

concurrency:
  group: android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play:
    name: Release to Google Play
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Write the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?the ANDROID_KEYSTORE_BASE64 secret is required}"
          keystore="$RUNNER_TEMP/upload.jks"
          (umask 077 && base64 --decode <<<"$ANDROID_KEYSTORE_BASE64" >"$keystore")
          echo "ANDROID_KEYSTORE=$keystore" >>"$GITHUB_ENV"

      - name: Build and release
        run: bin/android-play.sh
